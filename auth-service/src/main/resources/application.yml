
server:
  port: ${SERVER_PORT:5000}

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
        type.preferred_instant_jdbc_type: TIMESTAMP

  flyway:
    enabled: ${FLYWAY_ENABLED:true}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

email:
  from: ${MAIL_FROM:${MAIL_USERNAME:}}
  display-name: ${MAIL_DISPLAY_NAME:Smart Port}

jwt:
  key: ${JWT_KEY}
  issuer: ${JWT_ISSUER:smartport}
  audience: ${JWT_AUDIENCE:smartport}
  access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
  refresh-token-minutes: ${JWT_REFRESH_TOKEN_MINUTES:10080}
  short-session-hours: ${JWT_SHORT_SESSION_HOURS:8}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  reset-password-token-minutes: 15
  cors:
    allowed-origins:
      - http://localhost:4200
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

logging:
  level:
    root: INFO
    com.smartport.auth: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: WARN
    org.flywaydb: INFO